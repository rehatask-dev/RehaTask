<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RehaTask</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>🏥 RehaTask</h1>

    <div class="card">
        <h2>📅 今日すること</h2>

        <div id="task-list">

    <div class="task-item">
        <label><input type="checkbox"> 計画書作成</label>
        <button onclick="this.parentElement.remove()">🗑️</button>
    </div>

    <div class="task-item">
        <label><input type="checkbox"> カンファレンス</label>
        <button onclick="this.parentElement.remove()">🗑️</button>
    </div>

    <div class="task-item">
        <label><input type="checkbox"> LIFE入力</label>
        <button onclick="this.parentElement.remove()">🗑️</button>
    </div>

</div>
    </div>

    <div class="card">
        <h2>📆 カレンダー</h2>
        <p>ここにカレンダーを追加します。</p>
    </div>

    <div class="card">
        <h2>➕ タスク追加</h2>
        <button onclick="addTask()">
            タスクを追加
        </button>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
