<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RehaTask</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h1>🏥 RehaTask</h1>

  <!-- 今日すること -->
  <div class="card">
    <h2>📋 今日すること</h2>

    <div id="task-list">

      <div class="task-item">
        <label>
          <input type="checkbox" onchange="saveTasks()">
          計画書作成
        </label>
        <button onclick="deleteTask(this)">🗑️</button>
      </div>

      <div class="task-item">
        <label>
          <input type="checkbox" onchange="saveTasks()">
          カンファレンス
        </label>
        <button onclick="deleteTask(this)">🗑️</button>
      </div>

      <div class="task-item">
        <label>
          <input type="checkbox" onchange="saveTasks()">
          LIFE入力
        </label>
        <button onclick="deleteTask(this)">🗑️</button>
      </div>

    </div>

  </div>

  <!-- カレンダー -->
  <div class="card">

    <h2>📅 カレンダー</h2>

    <input type="date" id="taskDate">

    <button onclick="saveDate()">
      日付を保存
    </button>

    <p id="selectedDate">
      日付を選択してください
    </p>

  </div>

  <!-- タスク追加 -->
  <div class="card">

    <h2>➕ タスク追加</h2>

   <label>種類</label>

<select id="taskCategory">
  <option>📄 総合実施計画書</option>
  <option>💊 処方箋更新</option>
  <option>🏥 医療病棟カンファ</option>
  <option>👵 介護病棟カンファ</option>
  <option>📊 LIFE</option>
  <option>📋 一体的計画書</option>
  <option>📝 その他</option>
</select>

<input
  type="text"
  id="taskName"
  placeholder="タスク名">

<input
  type="date"
  id="taskDeadline">

<button onclick="addTask()">
  タスクを追加
</button>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
