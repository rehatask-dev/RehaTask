<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RehaTask</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h1>🏥 RehaTask</h1>

  <!-- 今日 -->
  <div class="card">
    <h2>🔴 今日すること</h2>
    <div id="today-list">
      <p>今日のタスクはありません</p>
    </div>
  </div>

  <!-- 今週 -->
  <div class="card">
    <h2>🟠 今週すること</h2>
    <div id="week-list">
      <p>今週のタスクはありません</p>
    </div>
  </div>

  <!-- 今月 -->
  <div class="card">
    <h2>🟢 今月すること</h2>
    <div id="month-list">
      <p>今月のタスクはありません</p>
    </div>
  </div>

  <!-- 全タスク -->
  <div class="card">
    <h2>📋 全タスク</h2>
    <div id="task-list"></div>
  </div>

  <!-- タスク追加 -->
  <div class="card">

    <h2>➕ タスク追加</h2>

    <label>カテゴリー</label>

    <select id="taskCategory" onchange="toggleCustomCategory()">

      <option value="📄 総合実施計画書">📄 総合実施計画書</option>

      <option value="💊 処方箋更新">💊 処方箋更新</option>

      <option value="🏥 医療病棟カンファ">🏥 医療病棟カンファ</option>

      <option value="👵 介護病棟カンファ">👵 介護病棟カンファ</option>

      <option value="📊 LIFE">📊 LIFE</option>

      <option value="📋 一体的計画書">📋 一体的計画書</option>

      <option value="other">📝 その他</option>

    </select>

    <input
      type="text"
      id="customCategory"
      placeholder="カテゴリー名を入力"
      style="display:none;">

    <input
      type="text"
      id="taskName"
      placeholder="タスク名">

    <input
      type="date"
      id="taskDeadline">

    <button onclick="addTask()">
      タスクを追加
    </button>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
